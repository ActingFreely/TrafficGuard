 name: Build TrafficGuard

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q "TrafficGuard_iOS16_云构建.zip" -d unpacked
          SRC=$(find unpacked -path '*/Sources/TrafficGuard.c' -print -quit)
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDK" \
            -dynamiclib \
            "$SRC" \
            -o build/TrafficGuard.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: TrafficGuard-dylib
          path: build/TrafficGuard.dylib
